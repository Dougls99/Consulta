<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de Scripts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#18212F; --muted:#5E6A7E;
  --line:#D9DFEA; --accent:#2F4BFF; --accent-ink:#FFFFFF; --mark:#FFE58A;
  --ok:#14804A; --err:#B3261E;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --surface:#182033; --ink:#E8ECF5; --muted:#9AA6BC;
    --line:#2A3550; --accent:#7C93FF; --accent-ink:#0F1522; --mark:#5A4B10;
    --ok:#5BD19A; --err:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#182033; --ink:#E8ECF5; --muted:#9AA6BC;
  --line:#2A3550; --accent:#7C93FF; --accent-ink:#0F1522; --mark:#5A4B10;
  --ok:#5BD19A; --err:#FF8A80;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.55;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.wrap{max-width:760px; margin:0 auto; padding:56px 20px 80px}
header{display:flex; justify-content:space-between; align-items:flex-start; gap:16px}
h1{
  font-family:var(--display); font-weight:800; letter-spacing:-.03em;
  font-size:clamp(2.2rem,6vw,3.4rem); line-height:1.02; margin:0 0 10px;
}
.sub{color:var(--muted); margin:0; max-width:46ch}
.icon-btn{
  flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  width:42px; height:42px; border-radius:50%; cursor:pointer; font-size:18px;
}
.icon-btn:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.search{
  margin-top:32px; display:flex; gap:10px; background:var(--surface);
  border:1.5px solid var(--line); border-radius:16px; padding:8px;
  transition:border-color .15s, box-shadow .15s;
}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search input{
  flex:1; min-width:0; border:0; background:transparent; color:var(--ink);
  font:inherit; font-size:1.1rem; padding:10px 12px; outline:none;
}
.search input::placeholder{color:var(--muted)}
.btn{
  border:0; border-radius:10px; background:var(--accent); color:var(--accent-ink);
  font:inherit; font-weight:600; padding:0 22px; cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55; cursor:wait}

.bar{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  margin:18px 2px 14px; color:var(--muted); font-size:.92rem; min-height:24px;
}
.bar button{
  border:0; background:none; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; padding:4px 0;
}
.bar button:hover{text-decoration:underline}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}

.results{display:grid; gap:14px}
.card{
  background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--accent);
  border-radius:12px; padding:18px 20px;
}
.card h2{
  font-family:var(--display); font-weight:600; font-size:1.2rem;
  letter-spacing:-.01em; margin:0 0 10px;
}
.script{white-space:pre-wrap; margin:0; max-width:68ch}
.card footer{display:flex; justify-content:flex-end; margin-top:14px}
.copy{
  border:1px solid var(--line); background:transparent; color:var(--ink);
  font:inherit; font-size:.9rem; font-weight:500; padding:6px 14px; border-radius:8px; cursor:pointer;
}
.copy:hover{border-color:var(--accent); color:var(--accent)}
.copy.done{border-color:var(--ok); color:var(--ok)}
mark{background:var(--mark); color:inherit; border-radius:3px; padding:0 2px}

.empty{
  text-align:center; color:var(--muted); padding:48px 16px;
  border:1.5px dashed var(--line); border-radius:12px;
}
.skeleton{height:110px; border-radius:12px; background:linear-gradient(90deg,var(--surface),var(--line),var(--surface)); background-size:200% 100%; animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
@media (max-width:480px){.btn{padding:0 16px}.wrap{padding-top:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Buscador de scripts</h1>
      <p class="sub">Digite um assunto e veja os scripts da planilha da equipe.</p>
    </div>
    <button class="icon-btn" id="tema" type="button" aria-label="Alternar tema claro e escuro">◐</button>
  </header>

  <form class="search" id="form" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Ex.: cancelamento, boas-vindas, cobrança" aria-label="Assunto" autofocus>
    <button class="btn" id="buscar" type="submit">Buscar</button>
  </form>

  <div class="bar">
    <span class="status" id="status" role="status" aria-live="polite">Carregando planilha…</span>
    <button type="button" id="atualizar">Atualizar dados</button>
  </div>

  <main class="results" id="resultados"></main>
</div>

<script>
// ===== CONFIGURAÇÃO =====
const ID_PLANILHA = "13bnnwDdEty5VoVOMDRDXm5U8GoKaNJo6IjJoBiZVTVw";
const GID = "0";
// ========================

const $ = (id) => document.getElementById(id);
const el = { q:$("q"), form:$("form"), btn:$("buscar"), status:$("status"), res:$("resultados"), upd:$("atualizar") };
let registros = []; // [{assunto, script}]

/* ---------- utilidades ---------- */
// Ignora maiúsculas e acentos (ex.: "cobranca" encontra "Cobrança")
const normalizar = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

const escapar = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function destacar(texto, termo) {
  if (!termo) return escapar(texto);
  const base = normalizar(texto), alvo = normalizar(termo);
  // normalizar pode mudar o tamanho do texto; se mudou, não destaca
  if (base.length !== texto.length) return escapar(texto);
  let saida = "", i = 0, pos;
  while ((pos = base.indexOf(alvo, i)) !== -1) {
    saida += escapar(texto.slice(i, pos)) + "<mark>" + escapar(texto.slice(pos, pos + alvo.length)) + "</mark>";
    i = pos + alvo.length;
  }
  return saida + escapar(texto.slice(i));
}

function definirStatus(texto, tipo = "") {
  el.status.textContent = texto;
  el.status.className = "status " + tipo;
}

/* ---------- leitura do CSV (aceita aspas e quebras de linha) ---------- */
function lerCSV(texto) {
  const linhas = []; let linha = [], campo = "", aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') aspas = false;
      else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && texto[i + 1] === "\n") i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = "";
    } else campo += c;
  }
  if (campo !== "" || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}

/* ---------- carregar planilha ---------- */
async function baixarCSV() {
  const urls = [
    `https://docs.google.com/spreadsheets/d/${ID_PLANILHA}/gviz/tq?tqx=out:csv&gid=${GID}`,
    `https://docs.google.com/spreadsheets/d/${ID_PLANILHA}/export?format=csv&gid=${GID}`
  ];
  let ultimoErro;
  for (const url of urls) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 30000);
      const r = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
      clearTimeout(t);
      if (!r.ok) throw new Error("HTTP " + r.status);
      return (await r.text()).replace(/^\uFEFF/, "");
    } catch (e) { ultimoErro = e; }
  }
  throw ultimoErro;
}

async function carregar() {
  el.btn.disabled = true; el.upd.disabled = true;
  definirStatus("Carregando planilha…");
  mostrarSkeleton();
  try {
    const linhas = lerCSV(await baixarCSV());
    if (!linhas.length) throw new Error("A planilha está vazia.");
    const cab = linhas[0].map((v) => normalizar(v.trim()));
    const iA = cab.indexOf("assunto"), iS = cab.indexOf("script");
    if (iA < 0 || iS < 0) throw new Error("A primeira linha da planilha deve conter as colunas “Assunto” e “Script”.");
    registros = linhas.slice(1)
      .filter((l) => l.length > Math.max(iA, iS))
      .map((l) => ({ assunto: l[iA].trim(), script: l[iS].trim() }))
      .filter((r) => r.assunto || r.script);
    definirStatus(`${registros.length} scripts carregados.`, "ok");
    buscar();
  } catch (e) {
    registros = [];
    el.res.innerHTML = `<div class="empty">Não foi possível ler a planilha.<br>Confira a conexão e se ela está compartilhada como “Qualquer pessoa com o link pode ver”.</div>`;
    definirStatus("Falha ao acessar a planilha: " + e.message, "err");
  } finally {
    el.btn.disabled = false; el.upd.disabled = false;
  }
}

/* ---------- busca ---------- */
function buscar() {
  const termo = el.q.value.trim();
  if (!registros.length) return;
  if (!termo) {
    el.res.innerHTML = `<div class="empty">Digite um assunto para ver os scripts.</div>`;
    definirStatus(`${registros.length} scripts disponíveis.`, "ok");
    return;
  }
  const alvo = normalizar(termo);
  const achados = registros.filter((r) => normalizar(r.assunto).includes(alvo));

  if (!achados.length) {
    el.res.innerHTML = `<div class="empty">Nenhum script encontrado para “${escapar(termo)}”.<br>Tente uma palavra mais curta.</div>`;
    definirStatus("Nenhum resultado.");
    return;
  }
  el.res.innerHTML = achados.map((r, i) => `
    <article class="card">
      <h2>${destacar(r.assunto, termo)}</h2>
      <p class="script">${escapar(r.script)}</p>
      <footer><button class="copy" type="button" data-i="${i}">Copiar script</button></footer>
    </article>`).join("");
  el.res.querySelectorAll(".copy").forEach((b) => b.addEventListener("click", () => copiar(b, achados[b.dataset.i].script)));
  definirStatus(`${achados.length} resultado(s) encontrado(s).`, "ok");
}

async function copiar(botao, texto) {
  try { await navigator.clipboard.writeText(texto); }
  catch {
    const t = document.createElement("textarea");
    t.value = texto; document.body.appendChild(t); t.select();
    document.execCommand("copy"); t.remove();
  }
  botao.textContent = "Copiado"; botao.classList.add("done");
  setTimeout(() => { botao.textContent = "Copiar script"; botao.classList.remove("done"); }, 1600);
}

function mostrarSkeleton() {
  el.res.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div>`;
}

/* ---------- eventos ---------- */
el.form.addEventListener("submit", (e) => { e.preventDefault(); buscar(); });
el.q.addEventListener("input", buscar);          // busca enquanto digita
el.upd.addEventListener("click", carregar);

$("tema").addEventListener("click", () => {
  const raiz = document.documentElement;
  const escuro = raiz.dataset.theme
    ? raiz.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  raiz.dataset.theme = escuro ? "light" : "dark";
});

carregar();
</script>
</body>
</html>
