<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerenciar scripts</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#18212F; --muted:#5E6A7E; --line:#D9DFEA;
  --accent:#2F4BFF; --accent-ink:#FFFFFF; --mark:#FFE58A; --ok:#14804A; --err:#B3261E;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1522;--surface:#182033;--ink:#E8ECF5;--muted:#9AA6BC;--line:#2A3550;--accent:#7C93FF;--accent-ink:#0F1522;--mark:#5A4B10;--ok:#5BD19A;--err:#FF8A80}
}
:root[data-theme="dark"]{--bg:#0F1522;--surface:#182033;--ink:#E8ECF5;--muted:#9AA6BC;--line:#2A3550;--accent:#7C93FF;--accent-ink:#0F1522;--mark:#5A4B10;--ok:#5BD19A;--err:#FF8A80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:860px;margin:0 auto;padding:48px 20px 80px}
h1{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:0 0 8px}
.sub{color:var(--muted);margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.top{display:flex;gap:8px;align-items:center}
.link,.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;height:42px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:inherit;font-weight:500;cursor:pointer}
.link{padding:0 16px}.icon-btn{width:42px;font-size:18px}
.link:hover,.icon-btn:hover{border-color:var(--accent)}

.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:11px 20px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--err);color:#fff}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:11px 14px;border-radius:10px}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea.field{min-height:200px;resize:vertical}
label{display:block;font-weight:600;margin:0 0 6px}

.login{max-width:420px;margin:48px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
.login h2{font-family:var(--display);margin:0 0 6px}
.login form{display:grid;gap:14px;margin-top:16px}
.msg{min-height:22px;font-size:.92rem}.msg.err{color:var(--err)}

.tools{display:flex;gap:10px;margin:28px 0 8px}
.tools .field{flex:1}
.bar{display:flex;justify-content:space-between;margin:10px 2px 14px;color:var(--muted);font-size:.92rem}
.bar button{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.list{display:grid;gap:12px}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.item h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
.item p{margin:0;color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .acts{display:flex;gap:8px;justify-content:flex-end}
.item .acts .btn{padding:6px 14px;font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:1.5px dashed var(--line);border-radius:12px}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:24px;width:min(640px,calc(100% - 24px))}
dialog::backdrop{background:rgba(10,15,30,.55)}
dialog h2{font-family:var(--display);margin:0 0 16px}
dialog form{display:grid;gap:16px}
.row{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Gerenciar scripts</h1>
      <p class="sub">Adicione, edite e exclua os scripts da planilha.</p>
    </div>
    <div class="top">
      <a class="link" href="index.html">Voltar à busca</a>
      <button class="icon-btn" id="tema" type="button" aria-label="Alternar tema claro e escuro">◐</button>
    </div>
  </header>

  <!-- Entrada com senha -->
  <section class="login" id="login">
    <h2>Acesso restrito</h2>
    <p class="sub">Entre com sua conta Google. Só quem é editor da planilha consegue alterar os scripts.</p>
    <form id="formLogin">
      <button class="btn" id="entrar" type="submit">Entrar com Google</button>
      <div class="msg err" id="msgLogin" role="alert"></div>
    </form>
  </section>

  <!-- Painel -->
  <section id="painel" hidden>
    <div class="tools">
      <input class="field" id="filtro" type="search" placeholder="Filtrar por assunto ou texto do script" aria-label="Filtrar">
      <button class="btn" id="novo" type="button">Novo script</button>
    </div>
    <div class="bar">
      <span id="contagem" role="status" aria-live="polite"></span>
      <span><button type="button" id="atualizar">Atualizar</button> · <button type="button" id="sair">Sair</button></span>
    </div>
    <div class="list" id="lista"></div>
  </section>
</div>

<!-- Formulário de adicionar/editar -->
<dialog id="dlgForm">
  <h2 id="tituloForm">Novo script</h2>
  <form id="form">
    <div><label for="fAssunto">Assunto</label><input class="field" id="fAssunto" required></div>
    <div><label for="fScript">Script</label><textarea class="field" id="fScript" required></textarea></div>
    <div class="msg err" id="msgForm" role="alert"></div>
    <div class="row">
      <button class="btn ghost" type="button" id="cancelar">Cancelar</button>
      <button class="btn" type="submit" id="salvar">Salvar</button>
    </div>
  </form>
</dialog>

<!-- Confirmação de exclusão -->
<dialog id="dlgExcluir">
  <h2>Excluir script?</h2>
  <p id="textoExcluir"></p>
  <div class="row">
    <button class="btn ghost" type="button" id="naoExcluir">Cancelar</button>
    <button class="btn danger" type="button" id="simExcluir">Excluir</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
// ===== CONFIGURAÇÃO =====
// ID do cliente OAuth criado no Google Cloud (termina em .apps.googleusercontent.com)
const CLIENT_ID = "850771851624-7vj86a0o4dp34m8kvb9i8vuautb0n5cc.apps.googleusercontent.com";
const ID_PLANILHA = "13bnnwDdEty5VoVOMDRDXm5U8GoKaNJo6IjJoBiZVTVw";
const GID = 0; // número depois de "gid=" no link da aba
// ========================

const $ = (id) => document.getElementById(id);
const API = "https://sheets.googleapis.com/v4/spreadsheets/" + ID_PLANILHA;
let token = "", email = "", cliente = null, aba = null;
let colA = 0, colS = 1, itens = [], editando = null, excluindo = null;

const escapar = (s) => s.replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normalizar = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const letra = (n) => { let s = ""; n++; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };

function aviso(texto) {
  const t = $("toast"); t.textContent = texto; t.classList.add("on");
  clearTimeout(aviso.id); aviso.id = setTimeout(() => t.classList.remove("on"), 3200);
}

/* ---------- Google Sheets API ---------- */
const rngRaw = (a1) => `'${aba.title.replace(/'/g, "''")}'!${a1}`;
const rng = (a1) => encodeURIComponent(rngRaw(a1));

async function sheets(caminho, opcoes = {}) {
  const r = await fetch(API + caminho, {
    ...opcoes,
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }
  });
  if (r.status === 401) { sair(); throw new Error("Sessão expirada. Entre novamente."); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const msg = (d.error && d.error.message) || "Erro " + r.status;
    if (r.status === 403 && !/not been used|disabled/i.test(msg)) throw new Error("Sua conta não tem permissão de editor nesta planilha.");
    if (r.status === 404) throw new Error("Planilha não encontrada ou sem acesso para sua conta.");
    throw new Error(msg);
  }
  return d;
}

async function carregar() {
  if (!aba) {
    const d = await sheets("?fields=sheets.properties(sheetId,title)");
    aba = (d.sheets || []).map((s) => s.properties).find((p) => p.sheetId === GID);
    if (!aba) throw new Error("Aba não encontrada (confira o GID).");
  }
  const v = (await sheets("/values/" + rng("A:ZZ"))).values || [];
  const cab = (v[0] || []).map((x) => normalizar(String(x).trim()));
  colA = cab.indexOf("assunto"); colS = cab.indexOf("script");
  if (colA < 0 || colS < 0) throw new Error("A primeira linha deve conter as colunas “Assunto” e “Script”.");
  itens = [];
  v.slice(1).forEach((l, i) => {
    const assunto = (l[colA] || "").trim(), script = (l[colS] || "").trim();
    if (assunto || script) itens.push({ linha: i + 2, assunto, script });
  });
  desenhar();
}

// Garante que a linha ainda é a mesma que a pessoa estava vendo
async function conferir(item) {
  const d = await sheets("/values/" + rng(`A${item.linha}:ZZ${item.linha}`));
  const l = (d.values || [[]])[0] || [];
  if ((l[colA] || "").trim() !== item.assunto || (l[colS] || "").trim() !== item.script)
    throw new Error("Esta linha foi alterada por outra pessoa. Atualize a lista.");
}

async function adicionar(dados) {
  const linha = new Array(Math.max(colA, colS) + 1).fill("");
  linha[colA] = dados.assunto; linha[colS] = dados.script;
  await sheets("/values/" + rng("A:ZZ") + ":append?valueInputOption=RAW&insertDataOption=INSERT_ROWS",
    { method: "POST", body: JSON.stringify({ values: [linha] }) });
}

async function editar(item, dados) {
  await conferir(item);
  await sheets("/values:batchUpdate", { method: "POST", body: JSON.stringify({
    valueInputOption: "RAW",
    data: [
      { range: rngRaw(`${letra(colA)}${item.linha}`), values: [[dados.assunto]] },
      { range: rngRaw(`${letra(colS)}${item.linha}`), values: [[dados.script]] }
    ]
  }) });
}

async function excluir(item) {
  await conferir(item);
  await sheets(":batchUpdate", { method: "POST", body: JSON.stringify({ requests: [{
    deleteDimension: { range: { sheetId: aba.sheetId, dimension: "ROWS", startIndex: item.linha - 1, endIndex: item.linha } }
  }] }) });
}

/* ---------- lista ---------- */
function desenhar() {
  const f = normalizar($("filtro").value.trim());
  const vis = itens.filter((i) => !f || normalizar(i.assunto + " " + i.script).includes(f));
  $("contagem").textContent = `${vis.length} de ${itens.length} scripts` + (email ? ` · ${email}` : "");
  $("lista").innerHTML = vis.length ? vis.map((i) => `
    <article class="item">
      <h2>${escapar(i.assunto)}</h2>
      <p>${escapar(i.script)}</p>
      <div class="acts">
        <button class="btn ghost" data-ed="${i.linha}">Editar</button>
        <button class="btn ghost" data-ex="${i.linha}">Excluir</button>
      </div>
    </article>`).join("")
    : `<div class="empty">${itens.length ? "Nenhum script corresponde ao filtro." : "A planilha ainda não tem scripts. Clique em “Novo script”."}</div>`;
}

$("lista").addEventListener("click", (e) => {
  const ed = e.target.dataset.ed, ex = e.target.dataset.ex;
  if (ed) abrirForm(itens.find((i) => i.linha == ed));
  if (ex) { excluindo = itens.find((i) => i.linha == ex); $("textoExcluir").textContent = `“${excluindo.assunto}” será removido da planilha.`; $("dlgExcluir").showModal(); }
});
$("filtro").addEventListener("input", desenhar);

/* ---------- adicionar / editar ---------- */
function abrirForm(item) {
  editando = item || null;
  $("tituloForm").textContent = item ? "Editar script" : "Novo script";
  $("fAssunto").value = item ? item.assunto : "";
  $("fScript").value = item ? item.script : "";
  $("msgForm").textContent = "";
  $("dlgForm").showModal();
  $("fAssunto").focus();
}
$("novo").addEventListener("click", () => abrirForm(null));
$("cancelar").addEventListener("click", () => $("dlgForm").close());

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const dados = { assunto: $("fAssunto").value.trim(), script: $("fScript").value.trim() };
  $("salvar").disabled = true; $("msgForm").textContent = "";
  try {
    if (editando) await editar(editando, dados); else await adicionar(dados);
    $("dlgForm").close();
    aviso(editando ? "Script atualizado." : "Script adicionado.");
    await carregar();
  } catch (err) { $("msgForm").textContent = err.message; }
  finally { $("salvar").disabled = false; }
});

/* ---------- excluir ---------- */
$("naoExcluir").addEventListener("click", () => $("dlgExcluir").close());
$("simExcluir").addEventListener("click", async () => {
  $("simExcluir").disabled = true;
  try { await excluir(excluindo); $("dlgExcluir").close(); aviso("Script excluído."); await carregar(); }
  catch (err) { $("dlgExcluir").close(); aviso(err.message); if (token) await carregar().catch(() => {}); }
  finally { $("simExcluir").disabled = false; }
});

/* ---------- login com Google ---------- */
function mostrarPainel(sim) { $("login").hidden = sim; $("painel").hidden = !sim; }

function falhaLogin(texto) { $("msgLogin").textContent = texto; $("entrar").disabled = false; }

async function aoReceberToken(resp) {
  if (resp.error) return falhaLogin("Não foi possível entrar: " + resp.error);
  token = resp.access_token;
  try {
    const u = await (await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers: { Authorization: "Bearer " + token } })).json();
    email = u.email || "";
    await carregar();
    mostrarPainel(true);
  } catch (err) { token = ""; $("msgLogin").textContent = err.message; }
  finally { $("entrar").disabled = false; }
}

$("formLogin").addEventListener("submit", (e) => {
  e.preventDefault();
  $("msgLogin").textContent = "";
  if (CLIENT_ID.startsWith("COLE_AQUI")) return falhaLogin("Configure a constante CLIENT_ID no início do script desta página.");
  if (!window.google || !google.accounts) return falhaLogin("O login do Google ainda não carregou. Aguarde um instante ou desative bloqueadores de anúncio.");
  $("entrar").disabled = true;
  cliente = cliente || google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: "https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email",
    callback: aoReceberToken,
    error_callback: (er) => falhaLogin("Login cancelado ou bloqueado (" + (er.type || "erro") + ").")
  });
  cliente.requestAccessToken();
});

function sair() {
  if (token && window.google) try { google.accounts.oauth2.revoke(token); } catch {}
  token = ""; email = ""; itens = []; mostrarPainel(false);
}
$("sair").addEventListener("click", sair);
$("atualizar").addEventListener("click", () => carregar().then(() => aviso("Lista atualizada.")).catch((e) => aviso(e.message)));

$("tema").addEventListener("click", () => {
  const r = document.documentElement;
  const escuro = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = escuro ? "light" : "dark";
});
</script>
</body>
</html>
